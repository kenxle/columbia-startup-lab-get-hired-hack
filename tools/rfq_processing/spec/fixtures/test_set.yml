      quantity_unit: "each"
      standard: null
      finish: "2B"
      coating: null
    reading: "Stainless steel, grade 304, finish 2B, sheet, thickness 0.0625 from the stainless table, width 48, length 120 (10 ft), quantity 19. Spec not written; A240 is the usual spec family."
    state_hint: ready
    ask: "Is 16 gauge 0.0625 in nominal, or do you need a specific decimal? Do you accept 304/304L dual cert? Do you need a mill cert?"
