# Test set T1 to T25, transcribed from
# docs/research/20261010.01_rfq_sharper_angle/research_domain_rules.md, section 6.
#
# kind: verbatim (exact text from a cited public document) or constructed (text written by the
# researcher from cited rules). All thicknesses, widths, lengths and walls are decimal inches.
# A null value means the research says unknown, not written, or cannot be read. Nothing here is
# added beyond what the research states; caveats live in notes.
#
# state_hint:
#   ready        the research says Ask: none, or only optional or low-cost questions
#   needs_buyer  the research gives a question that blocks pricing
#   cannot_read  the research says the line cannot be read or the thickness is unknown

