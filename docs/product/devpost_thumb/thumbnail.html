<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:800px;background:#0f1f3d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}

</style></head><body><div class="wrap"><div class="brand"><img src="rudco-mark.png" alt="RudCo"><div class="text"><span class="name">RudCo</span><span class="product">Quote Desk</span></div></div></div></body></html>
